name: KEMI Send Build All Platforms

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_VERSION: "1.84.1"

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Decode key.properties
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n \"$ENCODED_STRING\" ]; then
            echo \"$ENCODED_STRING\" | base64 -di > app/android/key.properties
          fi

      - name: Decode keystore
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          if [ -n \"$ENCODED_STRING\" ]; then
            mkdir -p android-keystore
            echo \"$ENCODED_STRING\" | base64 -di > android-keystore/kemi-send.keystore
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Dependencies (cargokit)
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: kemi-send-android
          path: app/build/app/outputs/flutter-apk/*.apk

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Dependencies (cargokit)
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release

      - name: Create zip
        shell: powershell
        working-directory: app
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath KEMI_Send-windows-x64.zip

      - name: Upload Windows zip
        uses: actions/upload-artifact@v6
        with:
          name: kemi-send-windows
          path: app/KEMI_Send-windows-x64.zip

  linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libfuse2

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Dependencies (cargokit)
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get

      - name: Build Linux
        working-directory: app
        run: flutter build linux --release

      - name: Create tar.gz
        working-directory: app
        run: |
          mkdir -p dist/KEMI_Send
          cp -r build/linux/x64/release/bundle/* dist/KEMI_Send/
          tar -czf KEMI_Send-linux-x64.tar.gz -C dist KEMI_Send

      - name: Upload Linux tar.gz
        uses: actions/upload-artifact@v6
        with:
          name: kemi-send-linux
          path: app/KEMI_Send-linux-x64.tar.gz

  macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Dependencies (app)
        working-directory: app
        run: flutter pub get

      - name: Dependencies (cargokit)
        working-directory: packages/localsend_isolates/rust_builder/cargokit/build_tool
        run: flutter pub get

      - name: Build macOS (ad-hoc signed)
        working-directory: app
        run: flutter build macos --release

      - name: Rename and zip .app
        working-directory: app
        run: |
          cd build/macos/Build/Products/Release
          rm -rf "KEMI Send.app"
          cp -R LocalSend.app "KEMI Send.app"
          zip -r ../../../../../../KEMI_Send-macos.app.zip "KEMI Send.app"

      - name: Upload macOS zip
        uses: actions/upload-artifact@v6
        with:
          name: kemi-send-macos
          path: app/KEMI_Send-macos.app.zip
